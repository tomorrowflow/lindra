name: Icon or tool bug
description: An icon looks or moves wrong, a package misbehaves, or the site, gallery or self-check fails.
labels: [bug]
body:
  - type: input
    id: icons
    attributes:
      label: Icons
      placeholder: compass, alarm-clock
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you saw instead, the palette and size, and a screenshot. For a self-check failure, paste the command and its output.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: kubai-icons-react 0.1.0, React 19
  - type: input
    id: env
    attributes:
      label: Browser and system
      placeholder: Chrome 141 on macOS 26, Node 24
