name: Skill feedback
description: A rule in PROMPT.md or SKILL.md was unclear, contradictory or missing.
labels: [skill]
body:
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: The section number and a short quote.
      placeholder: "PROMPT.md §4"
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: What you had to decide
      description: The icon you were drawing, what the rule left open, and what you chose. A screenshot helps.
    validations:
      required: true
