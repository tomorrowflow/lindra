name: Release

# Versions and publishes the packages with Changesets. On master, it opens or updates a
# "Version packages" pull request; merging that pull request publishes to npm.
# Publishing uses npm trusted publishing (OIDC), configured once per package on npmjs.com.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm test
      - name: Version or publish
        uses: changesets/action@v2
        with:
          # Records the icons this release adds in icons/versions.json.
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
        env:
          # The GitHub changelog generator reads this while versioning.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
