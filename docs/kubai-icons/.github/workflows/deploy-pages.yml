name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The site, on Cloudflare Pages. Analytics turns on only when the repository defines
  # these variables.
  cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the packages and site data
        run: npm run build
      - name: Test
        run: npm test
      - name: Build the site
        run: npm run build -w site
        env:
          NEXT_PUBLIC_SITE_URL: https://icons.kubai.design
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      - name: Keep the sitemap that is live now
        run: curl -fsS https://icons.kubai.design/sitemap.xml -o previous-sitemap.xml || true
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=kubai-icons --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Tell search engines about new pages
        continue-on-error: true
        run: node tools/indexnow.mjs previous-sitemap.xml site/out/sitemap.xml

  # The previous address, on GitHub Pages, forwards visitors to the site.
  forward-old-address:
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the forwarding page
        run: |
          mkdir forward
          cp tools/forward.html forward/index.html
          cp tools/forward.html forward/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: forward
      - id: deployment
        uses: actions/deploy-pages@v5
