<!--
  Question: Does the complete release-one flow hold together on screen: no case selected, case list and
  creation with treatment period, period correction with visit conflicts, admission assessment (free notes,
  form-aligned review steps, proposal comparison, acceptance, handover), dated visits (new or backdated within
  the period, notes, short review, acceptance, handover), case and encounter switching with a portrait drawer,
  dictation from every step as a blocking overlay, and the manual-edit, outdated-notes, changed-background,
  clarification, source, failure and unsaved states?
  Plan: One flow (grill 4 decisions: round-2 wizard A, round-1 C sidebar, round-1 B overlay). The ?variant=
  switcher selects a SCREEN of the flow (start, newcase, overview, period, a-notes, a-review, a-accept,
  a-handover, newvisit, v-notes, v-review, v-background, dict-rec, dict-review, errors, drawer) so the tab lists
  every screen; every screen is live, the operator can click on from any of them.
  State words are icons with a short label; the long explanation opens on tap (card comment of 2026-11-08).
  Assumptions: landscape stands in for the desktop browser; the fictional cases L-0001 to L-0003 and the
  date 2026-11-08 are fixed. Nothing here is real.
-->
<style>

<script>

    <button class="btn quiet" data-modal="newvisit" style="margin-top:6px">+ Neue Visite</button>
    <p class="hint" style="margin-top:18px">Jeder Kontakt hat eigene Notizen und einen eigenen Entwurf. Eine Visite wird nie an das Assessment angehängt; frühere Kontakte werden nicht umgeschrieben.</p></div>`;
}
function notesStep(c, e) {
  const steps = stepsFor(c, e);
  return `<div class="steptitle">Notizen <span class="n">${encLabel(e)}, ${fmtDT(e.at)} · frei: tippen, einfügen oder diktieren</span></div>
    <div class="stepbody" style="display:flex;flex-direction:column;gap:8px">${failLine()}${staleLine(c, e)}
      <textarea class="notes" data-notes ${app.dictation.status === "idle" ? "" : "readonly"} style="flex:1" placeholder="Eigene Notizen nach der Untersuchung …">${esc(e.notes)}</textarea></div>
    <div class="stepfoot"><button class="btn quiet big" data-act="startDictation" ${M.can(app, "startDictation", c, e) ? "" : "disabled"}>🎙 Diktat</button><span class="grow"></span>
      <button class="btn big" data-act="generate" ${M.can(app, "generate", c, e) ? "" : "disabled"}>${e.draft ? "Neuen Entwurf erzeugen" : "Entwurf erzeugen"}</button>
      <button class="btn quiet" data-go="${steps[1].key}">${esc(steps[1].short)} ›</button></div>`;
}
const failLine = () => (app.failure ? line("fail", "old", "Erzeugen fehlgeschlagen", app.failure, "fail") : "");
function staleLine(c, e) {

  if (M.bgChanged(c, e) && !e.proposal) h += line("bg", "bg", "Hintergrund seit Erstellung geändert", "Das Aufnahmeassessment oder eine frühere Visite wurde nach diesem Entwurf geändert. Der Text bleibt; eine Neuerzeugung nutzt den aktuellen Hintergrund.", "bg");

}
function proposalLine(c, e) {

  return line("proposal", "new", "Vorschlag liegt vor" + (skip.length ? " · " + skip.length + " Abschnitt(e) bleiben manuell" : ""), "Übernehmen gilt für den ganzen Entwurf" + (skip.length ? ", außer: " + skip.map((k) => titleOf(e, k)).join(", ") + ". Diese bleiben und werden als nicht aktualisiert markiert." : "; die Klärungsliste wird übernommen."), "prop");
}
function compare(c, e, k, stack) {
  const curL = e.draft ? e.draft[k] : null, prop = e.proposal ? e.proposal.draft[k] : null, editing = ui.editing === k;
  const curPane = editing
    ? `<div class="pane"><h5>Bisheriger Entwurf <span class="right"><button class="btn plain" data-doneedit="${k}">Fertig</button></span></h5><textarea class="edittext" data-editdraft="${k}">${esc((curL || []).map((p) => p.text).join("\n"))}</textarea></div>`
    : `<div class="pane"><h5>Bisheriger Entwurf <span class="right">${e.notUpdated[k] ? ico("keep") : e.edited[k] ? ico("edit") : ""}${e.draft ? `<button class="btn plain" data-edit="${k}">Bearbeiten</button>` : ""}</span></h5>${e.draft ? paragraphs(curL, { prefix: "C" + k, clar: true }) : `<p class="hint">Noch kein Entwurf.</p>`}</div>`;
  if (!e.proposal) return `<div class="cmp stack">${curPane}</div>`;
  const propPane = `<div class="pane new"><h5>Vorschlag <span class="right">${e.edited[k] ? ico("keep", "Wird übersprungen: manuell bearbeitet") : M.changes(e, k) ? ico("new", "Geändert") : `<span class="hint">unverändert</span>`}</span></h5>${paragraphs(prop, { prefix: "P" + k, isNew: (p) => !(curL && curL.some((d) => d.text === p.text)), clar: true })}</div>`;

function sectionStep(c, e, k, portrait) {

  const painHint = k === "schmerz" ? `<div class="pains" style="margin:8px 0"><div class="pain"><h6>Hauptschmerz (von der Ärztin benannt)</h6>Lokalisation, Ausstrahlung, Beginn/Verlauf, Intensität, Qualität, Modifikatoren, Bewältigung, Einschränkungen, Ziele</div><div class="pain"><h6>Weitere Schmerzprobleme</h6>getrennt, ohne Rangfolge; keine feste Anzahl</div></div>` : "";
  return `<div class="steptitle">${esc(sec[1])} ${sectionIcons(e, k)} <span class="n">Schritt ${i + 1} von ${steps.length}${sec[2] ? " · " + esc(sec[2]) : ""}</span></div>
    <div class="stepbody">${failLine()}${staleLine(c, e)}${proposalLine(c, e)}${painHint}${compare(c, e, k, portrait)}${clarFor(e, k)}</div>
    <div class="stepfoot"><button class="btn quiet" data-go="${prev.key}">‹ ${esc(prev.short)}</button><span class="grow"></span>

function finalStep(c, e) {

      <div class="hand"><div class="t">${ico("new")} Ersetzt</div><div></div><div class="txt">${esc(secs.map((s) => s[0]).filter((k) => !e.edited[k] && M.changes(e, k)).map((k) => titleOf(e, k)).join(", ") || "keine Änderungen")}</div></div>
      <div class="hand"><div class="t">${ico("keep")} Bleibt manuell</div><div></div><div class="txt">${esc(skip.map((k) => titleOf(e, k)).join(", ") || "keine")}</div></div>${clarFor(e)}</div>

    ${secs.map((s) => `<div class="hand"><div class="t">${esc(s[1])} ${sectionIcons(e, s[0])}</div>${e.copied[s[0]] ? ico("done") : `<button class="btn quiet" data-act="copy" data-section="${s[0]}" ${e.draft ? "" : "disabled"}>Kopieren</button>`}<div class="txt">${esc(((e.draft && e.draft[s[0]]) || []).map((p) => p.text).join(" ") || "Keine Angaben in den Notizen.")}</div></div>`).join("")}${clarFor(e)}</div>
    <div class="stepfoot"><button class="btn quiet" data-go="${back.key}">‹ Zurück</button><span class="grow"></span><button class="btn quiet" data-go="notizen">Notizen ergänzen</button>${e.kind === "assessment" ? `<button class="btn" data-modal="newvisit">+ Neue Visite</button>` : ""}</div>`;
}
// Modals: new case, period correction, new visit.
function modalHtml() {
  const { c } = cur(), f = ui.form;
  if (ui.modal === "newcase") {
    const bad = f.start && f.end && f.start > f.end, outside = f.at && f.start && f.end && (f.at.slice(0, 10) < f.start || f.at.slice(0, 10) > f.end);
    return `<div class="overlay"><div class="card"><h3>Neuer Fall</h3><div class="hint">Nur fiktive Kennungen. Keine Namen, Geburtsdaten oder Fallnummern des Krankenhauses.</div>
      <div class="form"><label>Fiktive Fallkennung</label><input data-field="id" value="${esc(f.id || "L-0004")}"><label>Kurzbezeichnung (optional)</label><input data-field="label" value="${esc(f.label || "")}" placeholder="z. B. Knie, fiktiv">
        <label>Behandlungsbeginn</label><input type="date" data-field="start" value="${esc(f.start || "2026-11-08")}"><label>Behandlungsende (einschließlich)</label><input type="date" data-field="end" value="${esc(f.end || "2026-11-28")}">${bad ? `<div class="err">Behandlungsende liegt vor Behandlungsbeginn.</div>` : ""}
        <label>Aufnahmeassessment</label><input type="datetime-local" data-field="at" value="${esc(f.at || "2026-11-08T11:00")}" min="${esc(f.start || "")}T00:00" max="${esc(f.end || "")}T23:59">${outside ? `<div class="err">Das Assessment muss im Behandlungszeitraum liegen.</div>` : `<div class="ok">Datum nur innerhalb des Behandlungszeitraums wählbar.</div>`}</div>

  }

    return `<div class="overlay"><div class="card"><h3>Behandlungszeitraum ändern</h3><div class="hint">${esc(c.id)} · bisher ${fmtD(c.period.start)} bis ${fmtD(c.period.end)}</div>
      <div class="form"><label>Behandlungsbeginn</label><input type="date" data-field="start" value="${esc(p.start)}"><label>Behandlungsende (einschließlich)</label><input type="date" data-field="end" value="${esc(p.end)}">
        ${p.start > p.end ? `<div class="err">Behandlungsende liegt vor Behandlungsbeginn.</div>` : conf.length ? `<div class="err">⚠ Nicht möglich: ${conf.length} Kontakt(e) lägen außerhalb des neuen Zeitraums: ${conf.map((x) => encLabel(x) + " (" + fmtD(x.at) + ")").join(", ")}. Kontakte werden nie gelöscht oder verschoben; erst Kontakt ändern, dann Zeitraum.</div>` : `<div class="ok">Alle ${M.encounters(c).length} Kontakte liegen im neuen Zeitraum.</div>`}</div>

    return `<div class="overlay"><div class="card"><h3>Neue Visite</h3><div class="hint">${esc(c.id)} · Behandlungszeitraum ${fmtD(c.period.start)} bis ${fmtD(c.period.end)}</div>

      <div class="row"><button class="btn" data-submit="newvisit" ${ok ? "" : "disabled"}>Visite anlegen</button><button class="btn quiet" data-close>Abbrechen</button></div></div></div>`;

function dictationOverlay() {

// ---------------------------------------------------------------------------------------------
// Screens. The variant switcher selects a screen; each sets up ui/app and renders the one live flow.
// ---------------------------------------------------------------------------------------------
function setup(scene) {
  app = M.initial(); Object.assign(ui, { caseId: null, encId: null, step: "notizen", modal: null, drawer: false, openRef: null, openMore: null, editing: null, form: {} });
  const c1 = () => { ui.caseId = "L-0001"; };
  const withProposal = () => {
    app = M.reduce(app, { type: "editNotes", enc: "a1", notes: app.cases[0].assessment.notes + "\n\n" + M.A_TRANSCRIPT }); app = M.reduce(app, { type: "editDraft", enc: "a1", section: "plan", text: "Stationäre multimodale Schmerztherapie indiziert (Chronifizierung, ambulante Maßnahmen ausgeschöpft). Ziele: NRS 4, Alltagsaktivitäten." }); app = M.reduce(app, { type: "generate", enc: "a1" }); };
  switch (scene) {
    case "start": break;
    case "newcase": ui.modal = "newcase"; break;
    case "overview": c1(); break;
    case "period": c1(); ui.modal = "period"; ui.form = { start: "2026-11-02", end: "2026-11-04" }; break;
    case "a-notes": c1(); ui.encId = "a1"; ui.step = "notizen"; break;
    case "a-review": c1(); withProposal(); ui.encId = "a1"; ui.step = "schmerz"; break;
    case "a-accept": c1(); withProposal(); ui.encId = "a1"; ui.step = "abschluss"; break;
    case "a-handover": c1(); ui.encId = "a1"; ui.step = "abschluss"; app = M.reduce(app, { type: "copy", enc: "a1", section: "sozial" }); break;
    case "newvisit": c1(); ui.modal = "newvisit"; ui.form = { at: M.defaultVisitAt(app, app.cases[0]) }; break;
    case "v-notes": c1(); ui.encId = "v2"; ui.step = "notizen"; break;
    case "v-review": c1(); app = M.reduce(app, { type: "generate", enc: "v2" }); ui.encId = "v2"; ui.step = "verlauf"; break;
    case "v-background": c1(); app = M.reduce(app, { type: "generate", enc: "v1" }); app = M.reduce(app, { type: "editNotes", enc: "a1", notes: app.cases[0].assessment.notes + "\n\nKorrektur: Lasègue rechts positiv bei 60°." }); app = M.reduce(app, { type: "generate", enc: "a1" }); app = M.reduce(app, { type: "accept", enc: "a1" }); app.changed = "Visite 03.11. geöffnet: Hintergrund wurde nach dem Entwurf geändert."; ui.encId = "v1"; ui.step = "verlauf"; break;
    case "dict-rec": c1(); withProposal(); ui.encId = "a1"; ui.step = "schmerz"; app = M.reduce(app, { type: "discard", enc: "a1" }); app = M.reduce(app, { type: "startDictation", enc: "a1" }); break;
    case "dict-review": c1(); withProposal(); ui.encId = "a1"; ui.step = "schmerz"; app.dictation = { status: "reviewing", transcript: "Nachtrag: Patient berichtet zusätzlich morgendliche Steifigkeit von etwa zwanzig Minuten.", target: "a1" }; break;
    case "errors": c1(); ui.encId = "a1"; ui.step = "sozial"; app = M.reduce(app, { type: "editNotes", enc: "a1", notes: app.cases[0].assessment.notes + "\n\nNachtrag." }); app = M.reduce(app, { type: "generate", enc: "a1", fail: true }); app = M.reduce(app, { type: "networkLost" }); break;
    case "drawer": c1(); ui.encId = "a1"; ui.step = "schmerz"; ui.drawer = true; break;
  }
}
const SCREENS = {
  start: "Start: kein Fall gewählt", newcase: "Neuer Fall mit Behandlungszeitraum", overview: "Fallübersicht: Assessment und Visiten", period: "Zeitraum ändern: Konflikt mit Visiten",
  "a-notes": "Assessment: Notizen", "a-review": "Assessment: Durchsicht Schmerzanamnese mit Vorschlag", "a-accept": "Assessment: Übernehmen", "a-handover": "Assessment: Übergabe",
  newvisit: "Neue Visite im Zeitraum", "v-notes": "Visite: Notizen", "v-review": "Visite: Durchsicht mit Hintergrundbezug", "v-background": "Visite: Hintergrund seit Erstellung geändert",
  "dict-rec": "Diktat aus der Durchsicht: Aufnahme", "dict-review": "Diktat: Transkript prüfen", errors: "Fehlschlag und nicht gespeichert", drawer: "Portrait: Fall- und Kontaktwechsel (Drawer)",
};
const VARIANTS = {};
Object.keys(SCREENS).forEach((k) => { VARIANTS[k] = { name: SCREENS[k], render: renderFlow, wire: wireCommon }; });
function renderFlow(st) {
  const portrait = st.orient === "portrait", { c, e } = cur();
  let main;
  if (!c) main = emptyMain();
  else if (!e) main = overviewMain(c);
  else if (ui.step === "notizen") main = notesStep(c, e);
  else if (ui.step === "abschluss") main = finalStep(c, e);
  else main = sectionStep(c, e, ui.step, portrait);
  const drawer = portrait && ui.drawer ? `<div class="drawer">${sidebarHtml()}</div>` : "";
  return `<div class="page"><div class="status"></div>${navBar(portrait)}<div class="body">${portrait ? "" : sidebarHtml()}<div class="main">${main}<div class="changed">${esc(app.changed)}</div></div>${drawer}</div>${modalHtml()}${dictationOverlay()}</div>`;
}

// ---------------------------------------------------------------------------------------------
// Shell (ios-shell.html; TARGETS = iPad; a "variant" is a screen, set up once when selected).
// ---------------------------------------------------------------------------------------------
const DEVICES = { iphone: { size: [402, 874], radius: 55 }, ipad: { size: [834, 1194], radius: 18 } };
const TARGETS = ["ipad"];
const q = new URLSearchParams(location.search);
const state = { variant: VARIANTS[q.get("variant")] ? q.get("variant") : "start", device: TARGETS.includes(q.get("device")) ? q.get("device") : TARGETS[0], orient: q.get("orient") === "landscape" ? "landscape" : "portrait" };
const bleed = q.has("bleed") || matchMedia("(pointer: coarse)").matches;
const device = document.getElementById("device"); const screen = document.getElementById("screen");
document.body.classList.toggle("bleed", bleed);
if (TARGETS.length < 2) document.querySelectorAll("[data-device]").forEach((b) => b.remove());
if (!TARGETS.includes("ipad")) document.querySelector("[data-orient]").remove();
function layout() {
  const d = DEVICES[state.device]; const [w, h] = state.orient === "landscape" ? [d.size[1], d.size[0]] : d.size;
  if (bleed) { Object.assign(device.style, { width: "100vw", height: "100vh", transform: "none" }); return; }
  const stage = document.getElementById("stage").getBoundingClientRect(); const scale = Math.min(1, (stage.width - 32) / w, (stage.height - 32) / h);
  device.style.setProperty("--radius", d.radius + "px"); Object.assign(device.style, { width: w + "px", height: h + "px", transform: `translate(-50%, -50%) scale(${scale})` });
}
let lastScene = null;
function render() {
  if (lastScene !== state.variant) { lastScene = state.variant; setup(state.variant); }
  const v = VARIANTS[state.variant];
  screen.className = `v-${state.variant} ${state.device} ${state.orient}`;
  screen.innerHTML = v.render(state); v.wire(screen, state);
  document.querySelector("#pill .label").textContent = `${Object.keys(SCREENS).indexOf(state.variant) + 1}/${Object.keys(SCREENS).length} ${v.name}`;
  layout();
}
function step(n) { const keys = Object.keys(VARIANTS); state.variant = keys[(keys.indexOf(state.variant) + n + keys.length) % keys.length]; render(); }
document.getElementById("pill").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.step) step(Number(b.dataset.step)); if (b.dataset.device) { state.device = b.dataset.device; render(); } if (b.hasAttribute("data-orient")) { state.orient = state.orient === "portrait" ? "landscape" : "portrait"; render(); } });
addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
addEventListener("resize", layout);
render();
if (q.has("tour")) { const order = q.get("tour").split(",").filter((v) => VARIANTS[v]); const show = (i) => { if (i >= order.length) return; state.variant = order[i]; render(); setTimeout(() => fetch(`__shot?${order[i]}`).catch(() => {}).finally(() => setTimeout(() => show(i + 1), 4000)), 800); }; show(0); }
</script>
