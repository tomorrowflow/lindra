name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Chromium, its system libraries and Python 3.12 come with the image, so no step
    # installs anything from a distribution mirror. The tag's Playwright version must
    # equal the `playwright==` pin in pyproject.toml; change both together.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          virtualenv --quiet .venv
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Format
        run: .venv/bin/python -m ruff format --check .

      - name: Vendor assets match their pins
        run: .venv/bin/python scripts/fetch_assets.py --check

      - name: Contrast
        run: .venv/bin/python scripts/contrast_check.py

      - name: Test
        run: .venv/bin/python -m pytest -q

      # The browser flow on an iPad-sized portrait and a desktop viewport. The script
      # exits non-zero on any finding; its pictures go to the runner's temp directory.
      - name: Browser flow
        run: .venv/bin/python scripts/screenshots.py "$RUNNER_TEMP/screenshots"
