# One service and its SQLite volume, for every tier (ADR 0007). Start it with
# `scripts/env.py up`, which writes the env file this file reads. The test tier
# adds compose.test.yaml.
#
# The backends are pinned to the deterministic stand-ins here on purpose: no
# variable selects a real or hosted text model or speech recognition (ADR 0003).
name: lindra

services:
  lindra:
    build: .
    restart: "no"
    environment:
      LINDRA_TOKEN: ${LINDRA_TOKEN:-}
      LINDRA_TIER: ${LINDRA_TIER:-throwaway}
      LINDRA_COMMIT: ${LINDRA_COMMIT:-unknown}
      LINDRA_TEXT_BACKEND: fixture
      LINDRA_SPEECH_BACKEND: fixture
      LINDRA_DATA_DIR: /data
    ports:
      - "${LINDRA_BIND:-127.0.0.1}:${LINDRA_PORT:-0}:8000"
    volumes:
      - lindra-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lindra-data:
