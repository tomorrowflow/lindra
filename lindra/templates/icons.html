{% macro icon(name) -%}
<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "menu" -%}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == "chevron-left" -%}
<path d="m15 18-6-6 6-6"/>
{%- elif name == "chevron-right" -%}
<path d="m9 18 6-6-6-6"/>
{%- elif name == "mic" -%}
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
{%- elif name == "circle-check" -%}
<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
{%- elif name == "circle-alert" -%}
<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
{%- elif name == "log-out" -%}
<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- endif -%}
</svg>
{%- endmacro %}
