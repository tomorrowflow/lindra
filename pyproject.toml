[project]
name = "lindra"
version = "0.1.0"
description = "Working assistant for a pain-therapy physician: admission assessment and visit drafts from the physician's own notes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "playwright>=1.50,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lindra*"]

[tool.setuptools.package-data]
lindra = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
